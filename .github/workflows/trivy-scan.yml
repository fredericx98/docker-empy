# Configure secret first:
# GitHub repository -> Settings -> Secrets and variables -> Actions -> New repository secret
# Name: TRIVY_SEVERITY
# Example value: HIGH,CRITICAL

name: Trivy Security Scan

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  trivy-fs-scan:
    # GitHub-hosted runner for scanning repository files
    runs-on: ubuntu-latest

    steps:
      # Pull repository contents so Trivy can scan the codebase
      - name: Checkout repository
        uses: actions/checkout@v5

      # Run Trivy filesystem scan on the current repository
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: ${{ secrets.TRIVY_SEVERITY }}
