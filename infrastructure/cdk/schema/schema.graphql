type Front {
  id: ID!
  name: String!
  status: FrontStatus!
  version: String
  lastDeployedAt: AWSDateTime
  lastInvalidationAt: AWSDateTime
}

enum FrontStatus {
  HEALTHY
  DEGRADED
  DOWN
  MAINTENANCE
}

type Execution {
  id: ID!
  type: ActionType!
  target: String!
  status: ExecutionStatus!
  triggeredBy: String
  startedAt: AWSDateTime!
  endedAt: AWSDateTime
  sfnArn: String
}

enum ActionType {
  DEPLOY_COMPLETO
  DEPLOY_FRONT
  BUILD_AMI
  CF_INVALIDACION
  MANTENIMIENTO
}

enum ExecutionStatus {
  RUNNING
  SUCCEEDED
  FAILED
  ABORTED
}

type InfraSnapshot {
  resource: String!
  data: AWSJSON!
}

type ExecutionConnection {
  items: [Execution!]!
  nextToken: String
}

type Query {
  listFronts: [Front!]!
  listExecutions(limit: Int, nextToken: String): ExecutionConnection!
  getExecution(id: ID!): Execution
  getInfra: [InfraSnapshot!]!
}

input TriggerDeployInput {
  type: ActionType!
  target: String!
  triggeredBy: String
}

type Mutation {
  triggerDeploy(input: TriggerDeployInput!): Execution! @aws_api_key
  updateFrontStatus(id: ID!, status: FrontStatus!, version: String): Front! @aws_api_key @aws_iam
  _updateExecution(id: ID!, status: ExecutionStatus!, endedAt: AWSDateTime): Execution! @aws_iam
}

type Subscription {
  onFrontStatusChanged(id: ID): Front
    @aws_subscribe(mutations: ["updateFrontStatus"])
    @aws_api_key
  onExecutionUpdated(id: ID): Execution
    @aws_subscribe(mutations: ["triggerDeploy", "_updateExecution"])
    @aws_api_key
}
