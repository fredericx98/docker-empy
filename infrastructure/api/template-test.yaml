AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BPlayBet Deploy API — SMOKE TEST ONLY.
  Single mock Lambda, no DynamoDB, no Step Functions, no EventBridge.
  Use this to validate API GW routes and WS connectivity before deploying the full stack.
  Deploy with: sam build -t template-test.yaml && sam deploy -t template-test.yaml --config-file samconfig-test.toml

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256

Resources:

  # ── REST API (no API Key required — easier to test with curl) ─────────────────
  TestRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: bplaybet-deploy-api-test
      StageName: v1
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Triggered-By'"
        AllowOrigin: "'*'"

  # ── WebSocket API ─────────────────────────────────────────────────────────────
  TestWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: bplaybet-deploy-ws-test
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  TestWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TestWebSocketApi
      StageName: v1
      AutoDeploy: true

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TestWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MockFunction.Arn}/invocations"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TestWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MockFunction.Arn}/invocations"

  MockWsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MockFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TestWebSocketApi}/*/*"

  # ── Mock Lambda — handles every route ────────────────────────────────────────
  MockFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: bplaybet-mock
      CodeUri: functions/mock/
      Handler: index.handler
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${TestWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
      Policies:
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TestWebSocketApi}/*"
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref TestRestApi
            Path: /deploy/status
            Method: GET
        GetActionStatus:
          Type: Api
          Properties:
            RestApiId: !Ref TestRestApi
            Path: /deploy/status/{action}
            Method: GET
        TriggerDeploy:
          Type: Api
          Properties:
            RestApiId: !Ref TestRestApi
            Path: /deploy/{action}
            Method: POST
        # Special endpoint: simulates the EventBridge → WS push without EventBridge.
        # Usage: POST /test-push?connectionId=<id>&action=asg-backend&status=SUCCEEDED
        TestPush:
          Type: Api
          Properties:
            RestApiId: !Ref TestRestApi
            Path: /test-push
            Method: POST

Outputs:
  RestEndpoint:
    Description: REST API base URL
    Value: !Sub "https://${TestRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  WebSocketEndpoint:
    Description: WebSocket URL — connect with wscat -c <url>
    Value: !Sub "wss://${TestWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  TestCommands:
    Description: Quick test sequence (replace REST_URL and WS_URL with the values above)
    Value: |
      1. wscat -c $WS_URL                                          # connect, note the connectionId in API GW console
      2. curl $REST_URL/deploy/status                              # all statuses
      3. curl $REST_URL/deploy/status/asg-backend                  # single action
      4. curl -X POST $REST_URL/deploy/asg-backend                 # trigger (returns 202)
      5. curl -X POST $REST_URL/deploy/image-builder               # trigger (returns 409, already RUNNING mock)
      6. curl -X POST "$REST_URL/test-push?connectionId=XXX&action=asg-backend&status=SUCCEEDED"
