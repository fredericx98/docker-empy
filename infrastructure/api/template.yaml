AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BPlayBet Deploy API — REST + WebSocket + Lambda + DynamoDB + Step Functions + EventBridge

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        CACHE_TABLE:             !Ref CacheTable
        AUDIT_TABLE:             !Ref AuditTable
        CONNECTIONS_TABLE:       !Ref ConnectionsTable
        ASG_BACKEND_SFN_ARN:     !Ref AsgBackendStateMachine
        FRONTS_SFN_ARN:          !Ref FrontsStateMachine
        IMAGE_BUILDER_SFN_ARN:   !Ref ImageBuilderStateMachine
        CF_INVALIDATION_SFN_ARN: !Ref CfInvalidationStateMachine
        CACHE_TTL_SECONDS:       "60"

Resources:

  # ── REST API ──────────────────────────────────────────────────────────────────
  DeployApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: bplaybet-deploy-api
      StageName: v1
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,x-api-key,X-Triggered-By'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: bplaybet-deploy-plan

  # ── WebSocket API ─────────────────────────────────────────────────────────────
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: bplaybet-deploy-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: v1
      AutoDeploy: true

  # $connect
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations"

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

  # $disconnect
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

  # ── DynamoDB ──────────────────────────────────────────────────────────────────
  # Short-lived status cache (TTL 60s). Avoids hammering Step Functions on every poll.
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action
          AttributeType: S
      KeySchema:
        - AttributeName: action
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Permanent audit log. PK=action SK=triggeredAt — query all runs per action.
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-audit"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: action
          AttributeType: S
        - AttributeName: triggeredAt
          AttributeType: S
      KeySchema:
        - AttributeName: action
          KeyType: HASH
        - AttributeName: triggeredAt
          KeyType: RANGE

  # Active WebSocket connections. TTL 2h auto-expires stale connections.
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Lambda Functions ──────────────────────────────────────────────────────────
  TriggerDeployFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-trigger-deploy"
      CodeUri: functions/trigger-deploy/
      Handler: index.handler
      Description: Checks for running executions, starts Step Functions, writes audit record
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt AsgBackendStateMachine.Name
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt FrontsStateMachine.Name
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ImageBuilderStateMachine.Name
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CfInvalidationStateMachine.Name
        - Statement:
            - Effect: Allow
              Action: states:ListExecutions
              Resource:
                - !Ref AsgBackendStateMachine
                - !Ref FrontsStateMachine
                - !Ref ImageBuilderStateMachine
                - !Ref CfInvalidationStateMachine
      Events:
        TriggerDeploy:
          Type: Api
          Properties:
            RestApiId: !Ref DeployApi
            Path: /deploy/{action}
            Method: POST

  GetStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-status"
      CodeUri: functions/get-status/
      Handler: index.handler
      Description: One-time status snapshot on page load; feeds initial UI state before WS takes over
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - Statement:
            - Effect: Allow
              Action: states:ListExecutions
              Resource:
                - !Ref AsgBackendStateMachine
                - !Ref FrontsStateMachine
                - !Ref ImageBuilderStateMachine
                - !Ref CfInvalidationStateMachine
      Events:
        GetAllStatus:
          Type: Api
          Properties:
            RestApiId: !Ref DeployApi
            Path: /deploy/status
            Method: GET
        GetActionStatus:
          Type: Api
          Properties:
            RestApiId: !Ref DeployApi
            Path: /deploy/status/{action}
            Method: GET

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ws-connect"
      CodeUri: functions/ws-connect/
      Handler: index.handler
      Description: Stores connectionId in DynamoDB when a client opens the WebSocket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ws-disconnect"
      CodeUri: functions/ws-disconnect/
      Handler: index.handler
      Description: Removes connectionId from DynamoDB when a client closes the WebSocket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  NotifyStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints: [index.js]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notify-status"
      CodeUri: functions/notify-status/
      Handler: index.handler
      Description: Triggered by EventBridge on SFN state change; pushes update to all WS connections
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ── EventBridge ───────────────────────────────────────────────────────────────
  # SFN emits execution state change events natively — no extra instrumentation needed.
  SfnStatusChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-sfn-status-change"
      Description: Fires when any managed SFN execution reaches a terminal state
      EventPattern:
        source:
          - aws.states
        detail-type:
          - "Step Functions Execution Status Change"
        detail:
          stateMachineArn:
            - !Ref AsgBackendStateMachine
            - !Ref FrontsStateMachine
            - !Ref ImageBuilderStateMachine
            - !Ref CfInvalidationStateMachine
          status:
            - SUCCEEDED
            - FAILED
            - TIMED_OUT
            - ABORTED
      Targets:
        - Arn: !GetAtt NotifyStatusFunction.Arn
          Id: NotifyStatusTarget

  NotifyStatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotifyStatusFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SfnStatusChangeRule.Arn

  # ── Step Functions ────────────────────────────────────────────────────────────
  # One state machine per action — keeps ListExecutions results isolated per action.
  # asg-backend and fronts share the same ASL definition but are independent SFNs.
  AsgBackendStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-asg-backend"
      DefinitionUri: statemachines/deploy-asg.asl.json
      Type: STANDARD
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt AsgBackendLogGroup.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  FrontsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-fronts"
      DefinitionUri: statemachines/deploy-asg.asl.json
      Type: STANDARD
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt FrontsLogGroup.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  ImageBuilderStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-image-builder"
      DefinitionUri: statemachines/image-builder.asl.json
      Type: STANDARD
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ImageBuilderLogGroup.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  CfInvalidationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-cf-invalidation"
      DefinitionUri: statemachines/cf-invalidation.asl.json
      Type: STANDARD
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CfInvalidationLogGroup.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  # ── CloudWatch Log Groups ─────────────────────────────────────────────────────
  AsgBackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-asg-backend"
      RetentionInDays: 30

  FrontsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-fronts"
      RetentionInDays: 30

  ImageBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-image-builder"
      RetentionInDays: 30

  CfInvalidationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-cf-invalidation"
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: REST API base URL
    Value: !Sub "https://${DeployApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  WebSocketEndpoint:
    Description: WebSocket connection URL (use in the frontend as the WS endpoint)
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  ApiKeyId:
    Description: Run 'aws apigateway get-api-key --api-key <ID> --include-value' to retrieve the key value
    Value: !Ref DeployApiApiKey

  CacheTableName:
    Value: !Ref CacheTable

  AuditTableName:
    Value: !Ref AuditTable
